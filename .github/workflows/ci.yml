name: CI

# 只跑测试，不负责发布。
# 发布交给 GitHub Pages 的「Deploy from a branch」，更稳、不依赖额外权限。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 单元测试（纯函数，无需安装依赖）
        run: |
          node test/scheduler.test.js
          node test/edit.test.js
          node test/focus.test.js
          node test/writeback.test.js
